name: CI/CD - Pruebas y Despliegue

on:
  push:
    branches: [ "main" ]

jobs:
  # ---------------------------------------------------------------
  # JOB 1: PRUEBAS
  # Ejecuta la prueba unitaria sobre el codigo del repositorio.
  # Si falla, el job de despliegue queda bloqueado automaticamente.
  # ---------------------------------------------------------------
  pruebas:
    name: Pruebas (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Ejecutar pruebas unitarias
        run: pytest -v

  # ---------------------------------------------------------------
  # JOB 2: CONSTRUCCION Y DESPLIEGUE
  # "needs: pruebas" -> solo arranca si el job de pruebas
  # termino con exito. Si las pruebas fallan, este job se cancela.
  # ---------------------------------------------------------------
  construir-y-desplegar:
    name: Construccion y Despliegue
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y subir imagen del backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/mi-api:latest

      - name: Desplegar en la instancia Cloud via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ${{ secrets.RUTA_SERVIDOR || '~/Servidor_Produccion' }}
            docker compose pull backend || docker-compose pull backend
            docker compose up -d || docker-compose up -d
            docker image prune -f
