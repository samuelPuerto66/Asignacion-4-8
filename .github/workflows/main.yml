name: CI/CD - Pruebas y Despliegue

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ---------------------------------------------------------------
  # JOB 1: PRUEBAS
  # Ejecuta la prueba unitaria sobre el codigo del repositorio.
  # Si falla, el job de despliegue queda bloqueado automaticamente.
  # ---------------------------------------------------------------
  pruebas:
    name: Pruebas (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Ejecutar pruebas unitarias
        run: pytest -v

  # ---------------------------------------------------------------
  # JOB 2: SEGURIDAD (Fail-Fast)
  # Bandit (SAST) revisa el codigo Python; Trivy revisa la imagen
  # ya construida. Cualquier hallazgo detiene el pipeline.
  # ---------------------------------------------------------------
  seguridad:
    name: Analisis de Seguridad (Bandit + Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Analisis estatico con Bandit
        run: |
          pip install bandit
          bandit -r backend/

      - name: Construir imagen para escaneo
        run: docker build -t imagen-escaneo:temp ./backend

      - name: Escaneo de contenedor con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: imagen-escaneo:temp
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  # ---------------------------------------------------------------
  # JOB 3: CONSTRUCCION Y DESPLIEGUE
  # "needs" -> solo arranca si pruebas y seguridad terminaron con
  # exito, y solo en push a main (nunca desde un pull_request).
  # ---------------------------------------------------------------
  construir-y-desplegar:
    name: Construccion y Despliegue
    runs-on: ubuntu-latest
    needs: [pruebas, seguridad]
    if: github.event_name == 'push'
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y subir imagen del backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/mi-api:latest

      - name: Copiar docker-compose.yml al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: ${{ secrets.RUTA_SERVIDOR || '~/Servidor_Produccion' }}

      - name: Desplegar en la instancia Cloud via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ${{ secrets.RUTA_SERVIDOR || '~/Servidor_Produccion' }}
            docker compose pull backend || docker-compose pull backend
            docker compose up -d || docker-compose up -d
            docker image prune -f
